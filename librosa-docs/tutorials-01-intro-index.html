<h1>基础</h1>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_01-load_thumb.png"><figcaption><a href="tutorials-01-intro-01-load.html#sphx-glr-auto-tutorials-01-intro-01-load-py">音频数据入门</a><br>本节介绍用 librosa 加载音频的基础知识。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_02-frequency_thumb.png"><figcaption><a href="tutorials-01-intro-02-frequency.html#sphx-glr-auto-tutorials-01-intro-02-frequency-py">频率与时频分析</a><br>本节演示如何计算并可视化音频信号的频率内容，以及如何计算频谱图以观察频率内容随时间的变化。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_03-f0_thumb.png"><figcaption><a href="tutorials-01-intro-03-f0.html#sphx-glr-auto-tutorials-01-intro-03-f0-py">基频</a><br>本节演示如何从录音中提取基频（f0）。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_04-harmony_thumb.png"><figcaption><a href="tutorials-01-intro-04-harmony.html#sphx-glr-auto-tutorials-01-intro-04-harmony-py">和声与色度</a><br>本节介绍分析录音谐波内容的工具。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_05-onsets_thumb.png"><figcaption><a href="tutorials-01-intro-05-onsets.html#sphx-glr-auto-tutorials-01-intro-05-onsets-py">起始点检测</a><br>本节介绍检测音乐起始点的问题，以及计算起始强度包络的底层方法。除直接用于起始点检测外，这里介绍的方法还是后续节奏分析的基础，下一节将对此展开。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_06-rhythm_thumb.png"><figcaption><a href="tutorials-01-intro-06-rhythm.html#sphx-glr-auto-tutorials-01-intro-06-rhythm-py">节奏分析</a><br>本节介绍从音频信号中估计速度与节拍位置的方法。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_07-timbre_thumb.png"><figcaption><a href="tutorials-01-intro-07-timbre.html#sphx-glr-auto-tutorials-01-intro-07-timbre-py">音色与频谱内容</a><br>本节介绍表示音频信号音色或纹理内容的常用工具。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_08-notation_thumb.png"><figcaption><a href="tutorials-01-intro-08-notation.html#sphx-glr-auto-tutorials-01-intro-08-notation-py">乐谱</a><br>本节介绍处理各种乐谱系统以及在它们之间转换的工具。</figcaption></figure>
