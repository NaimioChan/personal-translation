<h1>起始点检测</h1>

<p>librosa.onset 包含用于计算起始强度包络以及从音频信号中估计起始事件的函数。</p>

<table><tr><th>函数</th><th>说明</th></tr><tr><td><p><a href="api-librosa-onset-onset-detect.html#librosa.onset.onset_detect" title="librosa.onset.onset_detect"><code>onset_detect</code></a></p></td><td><p>通过在起始强度包络中挑选峰值来定位音符起始事件。</p></td></tr>
<tr><td><p><a href="api-librosa-onset-onset-strength.html#librosa.onset.onset_strength" title="librosa.onset.onset_strength"><code>onset_strength</code></a></p></td><td><p>计算频谱通量起始强度包络。</p></td></tr>
<tr><td><p><a href="api-librosa-onset-onset-strength-multi.html#librosa.onset.onset_strength_multi" title="librosa.onset.onset_strength_multi"><code>onset_strength_multi</code></a></p></td><td><p>在多个通道上计算频谱通量起始强度包络。</p></td></tr>
<tr><td><p><a href="api-librosa-onset-onset-backtrack.html#librosa.onset.onset_backtrack" title="librosa.onset.onset_backtrack"><code>onset_backtrack</code></a></p></td><td><p>把检测到的起始事件回溯到能量函数中最近的前一个局部极小值。</p></td></tr></table>
