<h1>进阶示例</h1>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_audio_playback_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-audio-playback.html#sphx-glr-auto-tutorials-03-advanced-plot-audio-playback-py">音频播放</a><br>本 notebook 演示如何用 IPython 的音频播放在网页浏览器中播放音频信号。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_chroma_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-chroma.html#sphx-glr-auto-tutorials-03-advanced-plot-chroma-py">增强色度与色度变体</a><br>本 notebook 演示多种增强色度特征的技术，并介绍 librosa 中实现的色度变体。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_dynamic_beat_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-dynamic-beat.html#sphx-glr-auto-tutorials-03-advanced-plot-dynamic-beat-py">速度随时间变化的节拍跟踪</a><br>本 notebook 演示在速度可能随时间变化的情形中如何使用节拍跟踪器。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_hprss_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-hprss.html#sphx-glr-auto-tutorials-03-advanced-plot-hprss-py">谐波-打击源分离</a><br>本 notebook 说明如何把音频信号分离为谐波与打击成分。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_music_sync_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-music-sync.html#sphx-glr-auto-tutorials-03-advanced-plot-music-sync-py">用动态时间规整进行音乐同步</a><br>在这个简短的教程中，我们演示如何使用 librosa 中实现的动态时间规整（DTW）进行音乐同步。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_patch_generation_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-patch-generation.html#sphx-glr-auto-tutorials-03-advanced-plot-patch-generation-py">高效生成片段</a><br>本 notebook 演示如何用 librosa.util.frame 高效生成信号中固定时长的片段。这在机器学习应用中很有用：模型在训练时可能要求输入具有固定大小，而你的数据长度却任意且可变。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_pcen_stream_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-pcen-stream.html#sphx-glr-auto-tutorials-03-advanced-plot-pcen-stream-py">PCEN 流式处理</a><br>本 notebook 演示如何配合 librosa.pcen 使用流式 IO，对频谱图逐步进行动态逐通道能量归一化。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_presets_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-presets.html#sphx-glr-auto-tutorials-03-advanced-plot-presets-py">预设</a><br>本 notebook 演示如何使用 presets 包更改 librosa 的默认参数。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_rainbowgram_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-rainbowgram.html#sphx-glr-auto-tutorials-03-advanced-plot-rainbowgram-py">Rainbowgram</a><br>本 notebook 演示如何使用 “Rainbowgram” 同时可视化幅度与（展开的）（差分）相位，正如 NSynth 论文 [1]_ 中所展示的那样。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_segmentation_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-segmentation.html#sphx-glr-auto-tutorials-03-advanced-plot-segmentation-py">拉普拉斯分割</a><br>本 notebook 实现了 McFee 与 Ellis 2014 年的拉普拉斯分割方法 [1]_，并做了几处小的稳定性改进。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_spectral_harmonics_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-spectral-harmonics.html#sphx-glr-auto-tutorials-03-advanced-plot-spectral-harmonics-py">谐波频谱</a><br>本 notebook 演示如何从音频信号中提取谐波频谱。基本思路是估计每个时间步的基频（f0），并提取 f0 整数倍处（即各次谐波）的能量。这种表示可用于刻画音色的短时演变，既可用于重合成 [1]_，也可用于下游分析 [2]_。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_superflux_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-superflux.html#sphx-glr-auto-tutorials-03-advanced-plot-superflux-py">Superflux 起始点</a><br>本 notebook 演示如何用 librosa 复现 Boeck 与 Widmer 2013 年的 Superflux 起始点检测算法 [1]_。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_viterbi_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-viterbi.html#sphx-glr-auto-tutorials-03-advanced-plot-viterbi-py">维特比解码</a><br>本 notebook 演示如何用维特比解码对逐帧状态预测施加时间平滑。</figcaption></figure>
