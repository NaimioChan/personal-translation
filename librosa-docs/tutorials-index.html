<h1>教程</h1>

<h2>基础</h2>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_01-load_thumb.png"><figcaption><a href="tutorials-01-intro-01-load.html#sphx-glr-auto-tutorials-01-intro-01-load-py">音频数据入门</a><br>本节介绍用 librosa 加载音频的基础知识。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_02-frequency_thumb.png"><figcaption><a href="tutorials-01-intro-02-frequency.html#sphx-glr-auto-tutorials-01-intro-02-frequency-py">频率与时间-频率分析</a><br>本节演示如何计算并可视化音频信号的频率成分，以及如何计算频谱图以观察频率成分随时间的变化。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_03-f0_thumb.png"><figcaption><a href="tutorials-01-intro-03-f0.html#sphx-glr-auto-tutorials-01-intro-03-f0-py">基频</a><br>本节演示如何从录音中提取基频（f0）。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_04-harmony_thumb.png"><figcaption><a href="tutorials-01-intro-04-harmony.html#sphx-glr-auto-tutorials-01-intro-04-harmony-py">和声与色度</a><br>本节介绍分析录音谐波内容的工具。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_05-onsets_thumb.png"><figcaption><a href="tutorials-01-intro-05-onsets.html#sphx-glr-auto-tutorials-01-intro-05-onsets-py">起始点检测</a><br>本节介绍检测音乐起始点的问题，以及计算起始强度包络的基本方法。除了直接用于起始点检测，这里介绍的方法也是节奏分析的基础，将在下一节中讲解。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_06-rhythm_thumb.png"><figcaption><a href="tutorials-01-intro-06-rhythm.html#sphx-glr-auto-tutorials-01-intro-06-rhythm-py">节奏分析</a><br>本节介绍从音频信号估计速度和节拍位置的方法。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_07-timbre_thumb.png"><figcaption><a href="tutorials-01-intro-07-timbre.html#sphx-glr-auto-tutorials-01-intro-07-timbre-py">音色与频谱内容</a><br>本节介绍表示音频信号音色或纹理内容的常用工具。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_08-notation_thumb.png"><figcaption><a href="tutorials-01-intro-08-notation.html#sphx-glr-auto-tutorials-01-intro-08-notation-py">乐谱记法</a><br>本节介绍处理各种乐谱记法体系及其相互转换的工具。</figcaption></figure>

<h2>显示与可视化</h2>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_01-wave_thumb.png"><figcaption><a href="tutorials-02-display-01-wave.html#sphx-glr-auto-tutorials-02-display-01-wave-py">可视化音频波形</a><br>本节介绍在 librosa 中可视化音频波形的主要方法。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_02-spectrogram_thumb.png"><figcaption><a href="tutorials-02-display-02-spectrogram.html#sphx-glr-auto-tutorials-02-display-02-spectrogram-py">可视化时间-频率内容</a><br>本节介绍 librosa.display.specshow，这是可视化类频谱图数据的主要函数。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_03-axes_thumb.png"><figcaption><a href="tutorials-02-display-03-axes.html#sphx-glr-auto-tutorials-02-display-03-axes-py">使用不同的频率轴</a><br>本节介绍各种频谱表示的频谱图显示方式，以及为绘图轴添加标注的不同记法体系。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_04-colors_thumb.png"><figcaption><a href="tutorials-02-display-04-colors.html#sphx-glr-auto-tutorials-02-display-04-colors-py">有效使用颜色</a><br>本节深入讨论 librosa.display.specshow 如何用颜色表示数据，然后给出一些用颜色制作有效可视化的技巧。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_05-nonspectral_thumb.png"><figcaption><a href="tutorials-02-display-05-nonspectral.html#sphx-glr-auto-tutorials-02-display-05-nonspectral-py">可视化非频谱数据</a><br>可视化非频谱数据</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_06-nonuniform_thumb.png"><figcaption><a href="tutorials-02-display-06-nonuniform.html#sphx-glr-auto-tutorials-02-display-06-nonuniform-py">非均匀坐标网格</a><br>非均匀坐标网格</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_07-multichannel_thumb.png"><figcaption><a href="tutorials-02-display-07-multichannel.html#sphx-glr-auto-tutorials-02-display-07-multichannel-py">多声道显示</a><br>多声道显示</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_08-mireval_thumb.png"><figcaption><a href="tutorials-02-display-08-mireval.html#sphx-glr-auto-tutorials-02-display-08-mireval-py">标注与 mir_eval 集成</a><br>标注与 mir_eval 集成</figcaption></figure>

<h2>进阶示例</h2>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_audio_playback_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-audio-playback.html#sphx-glr-auto-tutorials-03-advanced-plot-audio-playback-py">音频播放</a><br>本笔记本演示如何用 IPython 的音频播放功能在网页浏览器中播放音频信号。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_chroma_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-chroma.html#sphx-glr-auto-tutorials-03-advanced-plot-chroma-py">增强色度与色度变体</a><br>本笔记本演示多种增强色度特征的技术，并介绍 librosa 中实现的色度变体。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_dynamic_beat_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-dynamic-beat.html#sphx-glr-auto-tutorials-03-advanced-plot-dynamic-beat-py">速度随时间变化的节拍跟踪</a><br>本笔记本演示在速度可能随时间变化的情况下如何使用节拍跟踪器。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_hprss_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-hprss.html#sphx-glr-auto-tutorials-03-advanced-plot-hprss-py">谐波-打击源分离</a><br>本笔记本说明如何把音频信号分离为谐波成分和打击成分。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_music_sync_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-music-sync.html#sphx-glr-auto-tutorials-03-advanced-plot-music-sync-py">用动态时间规整实现音乐同步</a><br>在这个简短教程中，我们演示如何在 librosa 中用动态时间规整（DTW）实现音乐同步。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_patch_generation_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-patch-generation.html#sphx-glr-auto-tutorials-03-advanced-plot-patch-generation-py">高效生成片段</a><br>本笔记本演示如何用 librosa.util.frame 高效生成固定时长的信号片段。这在机器学习应用中很有用：模型在训练时可能期望固定尺寸的输入，而你的数据长度却是任意且多变的。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_pcen_stream_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-pcen-stream.html#sphx-glr-auto-tutorials-03-advanced-plot-pcen-stream-py">PCEN 流式处理</a><br>本笔记本演示如何将流式 IO 与 librosa.pcen 结合，对频谱图增量地做逐通道能量归一化。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_presets_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-presets.html#sphx-glr-auto-tutorials-03-advanced-plot-presets-py">预设</a><br>本笔记本演示如何用 presets 包更改 librosa 的默认参数。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_rainbowgram_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-rainbowgram.html#sphx-glr-auto-tutorials-03-advanced-plot-rainbowgram-py">彩虹图</a><br>本笔记本演示如何用“彩虹图”同时可视化幅度与（展开的）（差分）相位，如 NSynth 论文所述 [1]_。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_segmentation_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-segmentation.html#sphx-glr-auto-tutorials-03-advanced-plot-segmentation-py">拉普拉斯分割</a><br>本笔记本实现了 McFee and Ellis, 2014 [1]_ 中的拉普拉斯分割方法，并做了少量稳定性改进。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_spectral_harmonics_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-spectral-harmonics.html#sphx-glr-auto-tutorials-03-advanced-plot-spectral-harmonics-py">谐波频谱</a><br>本笔记本演示如何从音频信号中提取谐波频谱。基本思路是估计每个时刻的基频（f0），并提取 f0 整数倍处（即谐波）的能量。这种表示可用于描述音色的短时演化，既可用于重新合成 [1]_，也可用于下游分析 [2]_。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_superflux_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-superflux.html#sphx-glr-auto-tutorials-03-advanced-plot-superflux-py">Superflux 起始点</a><br>本笔记本演示如何用 librosa 复现 Boeck and Widmer, 2013 [1]_ 的 Superflux 起始点检测算法。</figcaption></figure>

<figure><img src="https://librosa.org/doc/latest/_images/sphx_glr_plot_viterbi_thumb1.png"><figcaption><a href="tutorials-03-advanced-plot-viterbi.html#sphx-glr-auto-tutorials-03-advanced-plot-viterbi-py">维特比解码</a><br>本笔记本演示如何用维特比解码对逐帧状态预测施加时间平滑。</figcaption></figure>
