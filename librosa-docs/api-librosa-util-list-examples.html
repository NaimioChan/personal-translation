<h1>librosa.util.list_examples</h1>

<p id="librosa.util.list-examples"><code>librosa.util.list_examples()</code> <a href="https://librosa.org/doc/latest/_modules/librosa/util/files.html#list_examples">[源码]</a></p>

<p>列出 librosa 附带的可用音频录音。</p>

<p>每个录音都有唯一标识符（例如 “brahms” 或 “nutcracker”），
