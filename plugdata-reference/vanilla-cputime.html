    <h1>[cputime]</h1>
    <p>测量 CPU 时间</p>
    <h2>描述</h2>
    <p>cputime 对象测量经过的 CPU 时间，由你的操作系统计量。这在 NT、IRIX 和 Linux 上似乎可行，但在 W98 上不行。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>bang</code>：重置（把已用时长设为零）</li>
    </ul>
    <p><strong>入口 2</strong></p>
    <ul>
      <li><code>bang</code>：测量时间</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>bang</code>：输出经过的时间</li>
    </ul>
