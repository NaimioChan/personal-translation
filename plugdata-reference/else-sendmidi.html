    <p style="color:var(--fg-muted);font-size:.92em">ELSE · MIDI</p>
    <h1>[sendmidi]</h1>
    <p>向 [<a href="vanilla-pd~.html">pd~</a>] 发送 MIDI 发送消息的辅助对象</p>
    <h2>描述</h2>
    <p>[<a href="else-sendmidi.html">sendmidi</a>] 是一个辅助抽象对象，用于向 [<a href="vanilla-pd~.html">pd~</a>] 对象发送 MIDI 消息，因为 [<a href="vanilla-pd~.html">pd~</a>] 无法监听 Pd 中已连接的 MIDI 设备。</p>
    <h2>入口</h2>
    <p>无记录。</p>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>anything</code>：待发送到 [<a href="vanilla-pd~.html">pd~</a>] 对象的 MIDI 消息</li>
    </ul>
