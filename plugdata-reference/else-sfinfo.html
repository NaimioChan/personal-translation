    <h1>[sfinfo]</h1>
    <p>查询声音文件信息</p>
    <h2>描述</h2>
    <p>[<a href="else-sfinfo.html">sfinfo</a>] 支持 [<a href="else-sfload.html">sfload</a>] 和 [<a href="else-play.file~.html">play.file~</a>] 支持的所有文件，可用于查询文件采样信息，但目前只能查询通道，因为该对象仍非常实验性）。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>read &lt;symbol&gt;</code>：加载声音文件</li>
      <li><code>channels</code>：查询通道数</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>anything</code>：声音文件信息</li>
    </ul>
