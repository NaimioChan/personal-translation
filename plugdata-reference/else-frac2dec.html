    <h1>[frac2dec]</h1>
    <p>分数/小数转换</p>
    <h2>描述</h2>
    <p>使用 [<a href="else-frac2dec.html">frac2dec</a>] 把单个元素或以分数 symbol 定义的音程列表转换为十进制浮点数。数字不必是整数，你也可以在括号里放第二个分数作为分母或分子。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>list</code>：小数值</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>list</code>：转换后的比值</li>
    </ul>
