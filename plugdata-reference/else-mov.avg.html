    <h1>[mov.avg]</h1>
    <p>移动平均</p>
    <h2>描述</h2>
    <p>[<a href="else-mov.avg.html">mov.avg</a>] 给出最近 'n' 个值的运行/移动平均值。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>float</code>：输入到移动平均的值</li>
    </ul>
    <p><strong>入口 2</strong></p>
    <ul>
      <li><code>float</code>：设置新的值数量并清空</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>float</code>：移动平均值</li>
    </ul>
