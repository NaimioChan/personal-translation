    <h1>[samps2ms]</h1>
    <p>采样点转 ms</p>
    <h2>描述</h2>
    <p>[<a href="else-samps2ms.html">samps2ms</a>] 是一个简单的抽象对象，把采样点数形式的时间值转换为 ms。换算表达式：ms = 1000*samps/ samplerate。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>float</code>：以采样点数表示的时间值</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>float</code>：转换后的值，单位 ms</li>
    </ul>
