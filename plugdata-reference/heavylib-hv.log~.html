    <p style="color:var(--fg-muted);font-size:.92em">heavylib · 信号运算</p>
    <h1>[hv.log~]</h1>
    <p>信号速率对数运算</p>
    <h2>描述</h2>
    <p>信号速率的对数运算。左入口必须是信号，右入口接收底数。底数也可以选择用对象初始化。如果没有提供底数，则假定为自然对数（底 e）。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>signal</code>：输入到 log 函数</li>
    </ul>
    <p><strong>入口 2</strong></p>
    <ul>
      <li><code>float</code>：底数（默认：e）</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>signal</code>：log 函数的输出</li>
    </ul>
