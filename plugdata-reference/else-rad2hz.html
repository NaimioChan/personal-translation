    <p style="color:var(--fg-muted);font-size:.92em">ELSE · 数据运算 · 转换器</p>
    <h1>[rad2hz]</h1>
    <p>每采样点弧度到 Hz 的转换</p>
    <h2>描述</h2>
    <p>使用 [<a href="else-rad2hz.html">rad2hz</a>] 把以 "每采样点弧度" 表示频率的信号转换为 Hz。这取决于 patch 的采样率（sr）。转换公式是；<br>hz = rad * sr / 2pi</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>list</code>：每采样点的弧度值</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>list</code>：转换后的 Hz 值</li>
    </ul>
