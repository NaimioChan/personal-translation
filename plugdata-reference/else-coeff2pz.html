    <h1>[coeff2pz]</h1>
    <p>双二阶系数到极点/零点转换</p>
    <h2>描述</h2>
    <p>[<a href="else-coeff2pz.html">coeff2pz</a>] 把输入的 biquad 系数转换为 2 个极点/零点的坐标。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>list</code>：要转换的 biquad 系数</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>list</code>：2 个极点的坐标</li>
    </ul>
    <p><strong>出口 2</strong></p>
    <ul>
      <li><code>list</code>：2 个零点的坐标</li>
    </ul>
    <p><strong>出口 3</strong></p>
    <ul>
      <li><code>float</code>：滤波器响应的总增益</li>
    </ul>
