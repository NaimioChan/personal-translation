    <p style="color:var(--fg-muted);font-size:.92em">vanilla · 数据运算</p>
    <h1>[mod]</h1>
    <p>两个数字相除，输出余数</p>
    <p>别名：<code>%</code></p>
    <h2>描述</h2>
    <p>div 与 mod 进行整数除法，其中 div 输出整数商，mod 输出余数（模数</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>bang</code>：触发计算并输出值</li>
      <li><code>float</code>：设置左侧的值并触发输出</li>
    </ul>
    <p><strong>入口 2</strong></p>
    <ul>
      <li><code>float</code>：设置右侧的值</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>float</code>：运算结果</li>
    </ul>
    <h2>参数</h2>
    <table>
      <thead>
        <tr><th>#</th><th>类型</th><th>默认值</th><th>说明</th></tr>
      </thead>
      <tbody>
        <tr><td>1</td><td><code>float</code></td><td><code>0</code></td><td>初始化右入口的值</td></tr>
