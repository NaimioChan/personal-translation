    <p style="color:var(--fg-muted);font-size:.92em">cyclone · 数据管理</p>
    <h1>[iter]</h1>
    <p>按顺序拆分消息</p>
    <h2>描述</h2>
    <p>[<a href="cyclone-iter.html">iter</a>] 类似 [unnpack]，它拆分消息（为 float/symbol），但按给定顺序依次输出。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>bang</code>：把最后收到的输入作为连续的元素输出</li>
      <li><code>anything</code>：按顺序分割元素</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>float/symbol</code>：依据输入元素，按顺序</li>
    </ul>
