    <p style="color:var(--fg-muted);font-size:.92em">ELSE · 混音与路由</p>
    <h1>[spread.mc~]</h1>
    <p>把信号输入分散到多通道输出</p>
    <h2>描述</h2>
    <p>[<a href="else-spread.mc~.html">spread.mc~</a>] 以等功率声像把任意数量的输入通道分散到任意数量的输出通道。它接收并输出多通道信号。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>signals</code>：多通道输入</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>signals</code>：多通道输出</li>
    </ul>
    <h2>参数</h2>
    <table>
      <thead>
        <tr><th>#</th><th>类型</th><th>默认值</th><th>说明</th></tr>
      </thead>
      <tbody>
        <tr><td>1</td><td><code>float</code></td><td><code>2</code></td><td>输出通道数</td></tr>
      </tbody>
    </table>

      </thead>
      <tbody>
        <tr><td><code>n &lt;float&gt;</code></td><td>设置输出通道数</td></tr>
