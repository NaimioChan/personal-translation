    <h1>[freeze~]</h1>
    <p>冻结</p>
    <h2>描述</h2>
    <p>[<a href="else-freeze~.html">freeze~</a>] 是基于 [<a href="vanilla-sigmund~.html">sigmund~</a>]（分析与重合成）的抽象对象。它包含一组振荡器。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>signal</code>：输入到 freeze</li>
    </ul>
    <p><strong>入口 2</strong></p>
    <ul>
      <li><code>float</code>：非 0 冻结（或重新冻结），0 解冻</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>signal</code>：冻结输出</li>
    </ul>
    <h2>方法</h2>
    <table>
      <thead>
        <tr><th>消息</th><th>说明</th></tr>
      </thead>
      <tbody>
        <tr><td><code>freeze</code></td><td>（重新）冻结</td></tr>
        <tr><td><code>unfreeze</code></td><td>解除冻结</td></tr>
      </tbody>
