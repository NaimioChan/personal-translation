    <h1>[detect~]</h1>
    <p>周期/频率检测</p>
    <h2>描述</h2>
    <p>[<a href="else-detect~.html">detect~</a>] 检测触发事件之间的频率/周期。触发发生在从非正数到正数的跳变时。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>signal</code>：用于触发该对象的任意 signal</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>signal</code>：检测到的周期/频率</li>
    </ul>
    <h2>参数</h2>
    <table>
      <thead>
        <tr><th>#</th><th>类型</th><th>默认值</th><th>说明</th></tr>
      </thead>
      <tbody>
        <tr><td>1</td><td><code>symbol</code></td><td><code>&lt;samps&gt;</code></td><td>检测类型：&lt;samps&gt;, &lt;bpm&gt;, &lt;ms&gt; 和 &lt;hz&gt;</td></tr>
