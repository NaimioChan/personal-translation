    <h1>[hz2rad]</h1>
    <p>Hz 到每采样点弧度的转换</p>
    <h2>描述</h2>
    <p>[<a href="else-hz2rad.html">hz2rad</a>] 把频率（单位 Hz）转换为“每采样点弧度” - 它取决于 patch 的采样率（sr）。转换公式为；<br>rad = (hz * 2*pi / sr)。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>list</code>：Hz 值</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>list</code>：转换后的每采样点弧度值</li>
    </ul>
