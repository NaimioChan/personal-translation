    <h1>[changed2~]</h1>
    <p>检测方向变化</p>
    <h2>描述</h2>
    <p>[<a href="else-changed2~.html">changed2~</a>] 每当输入值改变方向时发送一个脉冲。右出口发送状态信息（递增时为 1，递减时为 -1，无变化时为 0）。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>signal</code>：要检测方向变化的 signal</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>signal</code>：检测到方向变化时产生冲量</li>
    </ul>
    <p><strong>出口 2</strong></p>
    <ul>
      <li><code>signal</code>：状态（1、-1 或 0）</li>
    </ul>
