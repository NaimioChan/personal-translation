    <h1>[trig2bang]</h1>
    <p>触发到 bang 的转换</p>
    <h2>描述</h2>
    <p>[<a href="else-trig2bang.html">trig2bang</a>] 检测从 0 到非 0 的跳变。可用于检测触发（门）并把它转换成 bang。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>float</code>：要检测触发的 signal</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>bang</code>：当检测到从 0 到非 0 的跳变时</li>
    </ul>
