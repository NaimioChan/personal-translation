    <h1>[dispatch]</h1>
    <p>把列表的元素分发到不同位置</p>
    <h2>描述</h2>
    <p>[<a href="else-dispatch.html">dispatch</a>] 接收一个列表，把每个元素发送到给定的地址（顺序从左到右）。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>list</code>：待分发其元素的列表</li>
      <li><code>bang</code>：再次分发上次的输入。</li>
    </ul>
    <h2>出口</h2>
    <p>无记录。</p>
    <h2>参数</h2>
    <table>
