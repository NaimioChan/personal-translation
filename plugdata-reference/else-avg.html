    <h1>[avg]</h1>
    <p>算术平均值</p>
    <h2>描述</h2>
    <p>[<a href="else-avg.html">avg</a>] 计算到目前为止接收到的所有数值的算术平均。clear 消息重置对象。</p>
    <h2>入口</h2>
    <p><strong>入口 1</strong></p>
    <ul>
      <li><code>float</code>：要加入移动平均的数值</li>
    </ul>
    <h2>出口</h2>
    <p><strong>出口 1</strong></p>
    <ul>
      <li><code>float</code>：目前为止的平均值</li>
    </ul>
    <p><strong>出口 2</strong></p>
    <ul>
      <li><code>float</code>：已处理值的总数</li>
    </ul>
    <h2>方法</h2>
    <table>
      <thead>
        <tr><th>消息</th><th>说明</th></tr>
      </thead>
      <tbody>
        <tr><td><code>clear</code></td><td>清空记忆（之前接收的数值）</td></tr>
      </tbody>
    </table>
