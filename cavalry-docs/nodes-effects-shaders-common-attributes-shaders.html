<h1>通用属性（着色器）</h1>
<h2 id="intro">简介</h2>
<p>以下属性在大多数着色器上通用。</p>
<h2 id="ui">界面</h2>
<p><strong>Blend Mode</strong>：设置着色器的<a href="nodes-general-blend-modes.html">混合模式</a>。请注意，当一个图形连接了多个着色器时，此混合模式影响的是着色器之间在 <strong>Shaders</strong> 属性堆栈中的混合方式，而不是图形与视口中其他图形之间的混合方式——后者请使用图形 <strong>Shape</strong> 选项卡下的 <strong>Blend Mode</strong>。</p>
<p><strong>Opacity</strong>：设置着色器的不透明度。较低的值会增加透明度。</p>
