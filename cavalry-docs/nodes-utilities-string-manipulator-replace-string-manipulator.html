<h1>替换字符串操纵器</h1>
<h2 id="intro">简介</h2>
<p>在文本字符串中查找并替换其中的部分内容。</p>
<h2 id="ui">界面</h2>
<p><strong>Replace</strong>：输入字符串中要替换的部分。</p>
<p><strong>With</strong>：输入用于替换 <strong>Replace</strong> 内容的字符串。</p>
<blockquote>
<p><b>信息：</b></p>
<p><code>.</code>（句点）符号是正则表达式中的特殊字符，表示“匹配任意内容”。要匹配 <code>.</code> 本身，需要用斜杠转义，如 <code>\.</code>。</p></blockquote>
