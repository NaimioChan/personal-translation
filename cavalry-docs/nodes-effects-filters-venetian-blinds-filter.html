<h1>百叶窗滤镜</h1>
<h2 id="intro">简介</h2>
<p>使用条纹擦除效果显示图形。</p>
<h2 id="ui">界面</h2>
<p><strong>Completion</strong>：以百分比设置擦除的完成程度。</p>
<p><strong>Width</strong>：设置每片“百叶”的宽度。</p>
<p><strong>Feather</strong>：设置羽化（模糊）。</p>
<p><strong>Rotation</strong>：设置百叶的角度。</p>
<p><strong>Screen Space</strong>：勾选后，擦除将基于合成而非图形本身。</p>
