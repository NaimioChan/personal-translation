<h1>填充颜色滤镜</h1>
<h2 id="intro">简介</h2>
<p>用于替换图形颜色的简单滤镜。</p>
<h2 id="ui">界面</h2>
<p><strong>Blend Mode</strong>：参见<a href="nodes-general-blend-modes.html">混合模式</a>。</p>
<p><strong>Color</strong>：使用 Hex、RGB 或 HSV 值设置颜色。</p>
<p><strong>Premultiply</strong>：勾选后，透明像素的计算会采用预乘。</p>
<blockquote>
<p><b>信息：</b></p>
<p>颜色的动画只能直接用于 RGB 值。如果需要 HSV，请将 <a href="nodes-utilities-hsv-color.html">HSV Color Utility</a> 连接到 <strong>Color</strong>。</p></blockquote>
