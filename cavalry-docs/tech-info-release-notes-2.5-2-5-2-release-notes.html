<h1>2.5.2 发行说明</h1>
<p><code>发布日期：2025 年 10 月 14 日</code></p>
<h2 id="notable-bug-fixes">重要错误修复</h2>
<ul>
<li>修复了部分用户反馈的问题：<strong>加载场景</strong>包含特定循环依赖组合时，可能导致 Cavalry <strong>卡死</strong>。</li>
<li>文本<strong>上标</strong>的定位已恢复。</li>
<li>修复了<strong>复制</strong>合成时出现的问题：该合成包含带有<a href="nodes-shapes-composition-pre-comp-overrides.html">预合成覆盖</a> 的 <strong>Pre-Comps</strong>，且位于<a href="nodes-shapes-layouts-layout-group.html">布局组</a>内。</li>
<li>修复了<strong>Edit Limits</strong> 与非整数值相关的问题。</li> </ul>
