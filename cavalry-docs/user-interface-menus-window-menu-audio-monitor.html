<h1>音频监视器</h1>
<h2 id="intro">简介</h2>
<p>Audio Monitor 可用于采样音频播放的分贝等级。</p>
<p>该电平表有助于确保合成中的任何音频都具有清晰、平衡的电平。音量过大会导致可听见的失真和削波。</p>
<h2 id="ui">界面</h2>
<p>电平表具有从 -50 到 0 dB 的分贝刻度，并会在可听见的 <a href="nodes-behaviours-sound.html">声音</a> 行为播放时显示音频电平。</p>
<p>音频电平初始为绿色，当音频接近或开始在 0 dB 以上出现削波时，会变为黄色或红色。</p>
