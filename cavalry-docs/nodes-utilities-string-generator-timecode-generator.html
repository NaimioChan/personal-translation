<h1>时间码生成器</h1>
<h2 id="intro">简介</h2>
<p>生成时间码。</p>
<h2 id="ui">界面</h2>
<p><strong>Frame</strong>：默认连接到<a href="user-interface-menus-window-menu-scene-window-scene-tree-composition-settings.html">合成</a>的 Time。</p>
<p><strong>Frame Offset</strong>：为输出添加/减去一个值。</p>
<p><strong>Frames per Second</strong>：默认连接到<a href="user-interface-menus-window-menu-scene-window-scene-tree-composition-settings.html">合成</a>的 FPS。</p>
<p><strong>Delimiter</strong>：输入一个字符，用于分隔时间码的小时、分钟、秒和帧。</p>
