<h1>操纵器</h1>
<h2 id="intro">简介</h2>
<p>为图形应用变换。</p>
<h2 id="ui">界面</h2>
<p><a href="nodes-behaviours-common-attributes-behaviours.html">Common Attributes</a> +</p>
<p><strong>Position</strong>：设置位置 [x,y]。0,0 位于合成的中心。</p>
<p><strong>Rotation</strong>：设置旋转角度（单位为度）。</p>
<p><strong>Scale</strong>：设置缩放值 [x,y]。</p>
<p><strong>Pivot</strong>：设置轴心点 [x,y]。在为旋转和缩放制作动画时很有用。</p>
