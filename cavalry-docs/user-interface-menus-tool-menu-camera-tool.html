<h1>摄像机工具</h1>
<h2 id="intro">简介</h2>
<p>在<a href="user-interface-menus-window-menu-viewport.html">视口</a>中操作<a href="nodes-utilities-camera.html">摄像机</a>。</p>
<h2 id="ui">界面</h2>
<p>单击该工具以启用它。</p>
<p><kbd>Option/Alt</kbd> + 单击该工具可创建摄像机。</p>
<h2 id="tool-settings">工具设置</h2>
<h2 id="shortcuts">快捷键</h2>
<blockquote>
<p><b>小心：</b></p>
<p>摄像机工具目前仅支持 <strong>Look At</strong> 摄像机。</p></blockquote>
<table>
<thead>
<tr>
<th>快捷键</th>
<th>说明</th></tr></thead>
<tbody>
<tr>
<td><kbd>Option/Alt</kbd> + 单击 + 拖拽</td>
<td>在 X 和 Y 轴上平移。</td></tr>
<tr>
<td><kbd>Shift</kbd> + 单击 + 上下拖拽</td>
<td>推拉/在 Z 轴上平移。</td></tr>
<tr>
<td><kbd>Cmd/Ctrl</kbd> + 单击 + 拖拽</td>
<td>环绕。</td></tr></tbody></table>
