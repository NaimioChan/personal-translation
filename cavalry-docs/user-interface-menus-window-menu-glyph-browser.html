<h1>字形浏览器</h1>
<h2 id="intro">简介</h2>
<p>Glyph Browser 提供了一种访问字体中所有字形的方式，包括无法通过键盘输入的字形。</p>
<h2 id="ui">界面</h2>
<p>在窗口底部的选项中选择 <strong>font</strong> 及其 <strong>weight</strong>。</p>
<p>使用 <strong>Size</strong> 滑块减小/增大每个字形的预览。</p>
<p>双击某个字形即可将其复制到剪贴板，之后可以粘贴到 String 中。</p>
