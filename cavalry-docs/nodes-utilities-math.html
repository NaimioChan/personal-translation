<h1>数学</h1>
<h2 id="intro">简介</h2>
<p>对单通道属性执行简单的数学运算。</p>
<h2 id="ui">界面</h2>
<p><strong>First</strong>：设置或连接一个值，作为第一个操作数。</p>
<p><strong>Operation</strong>：选择要应用于 <strong>First</strong> 和 <strong>Second</strong> 值的数学运算。</p>
<p><strong>Second</strong>：设置或连接一个值，作为第二个操作数。</p>
<p><strong>Result</strong>：返回运算结果的只读属性。</p>
<blockquote>
<p><b>信息：</b></p>
<p><strong>Math</strong> 输出单个通道，因此可用于连接其他单通道。对于 <strong>Position</strong> 这类包含多个通道 <code>[x,y,z]</code> 的属性，请使用 <a href="nodes-utilities-math2.html">运算2</a> 或 <a href="nodes-utilities-math3.html">运算3</a>。</p></blockquote>
