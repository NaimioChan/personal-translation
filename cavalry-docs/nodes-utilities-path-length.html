<h1>路径长度</h1>
<h2 id="intro">简介</h2>
<p>输出路径的长度。</p>
<h2 id="ui">界面</h2>
<p><strong>Input Shape</strong>：连接一个图形，以输出其长度。</p>
<p><strong>Strength</strong>：确定该行为的作用强度。</p>
<p><strong>Offset</strong>：为输出添加/减去一个值。</p>
<p><strong>Length</strong> [只读]：图层的输出。例如 <strong>Input Shape</strong> 的长度。</p>
