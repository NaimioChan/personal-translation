<h1>打乱分布</h1>
<h2 id="intro">简介</h2>
<p>通过重新排列子网格的 Id 来分布点。</p>
<figure><div>
<iframe src="https://youtube.com/embed/JWqdei_tqOk" height="360" width="100%" loading="lazy"></iframe></div>
<figcaption>查看 Kyle Daily 的教程。</figcaption></figure>
<h2 id="ui">界面</h2>
<p><strong>Input Distribution</strong>：连接要影响其 id 的子网格。</p>
<p><strong>Reverse</strong>：反转 id。</p>
<p><strong>Shuffle</strong>：随机化 id。</p>
<p><strong>Seed</strong>：设置随机种子。</p>
<figure>
<img src="https://cavalry.studio/docs/assets/images/-MYQ9UNmAOENxNLrckao-shuffle-dde86c96aa20a555d29bb2e0a24a3f84.png" alt="" loading="lazy">
<figcaption>打乱 Distribution 之前（左）与之后（右）。 </figcaption></figure>
<p>打乱不会影响每个 id 的绘制顺序。注意上图，<code>id0</code> 仍在后面，而 <code>id8</code> 位于顶部。</p>
