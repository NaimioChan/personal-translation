<h1>方向模糊滤镜</h1>
<h2 id="intro">简介</h2>
<p>沿某一轴模糊图形，以产生拖影效果或模拟运动模糊。</p>
<figure>
<img src="https://cavalry.studio/docs/assets/images/filter-directional-blur-5048beb3d3ad0e4ed19d6c6f225fa481.png" alt="" loading="lazy">
<figcaption>摄影：Xingye Jiang，来自 Unsplash</figcaption></figure>
<h2 id="ui">界面</h2>
<p><strong>Angle</strong>：以度为单位设置模糊方向。</p>
<p><strong>Blur Amount</strong>：设置方向模糊效果的距离/强度。较高的值会产生更明显的模糊拖影。</p>
