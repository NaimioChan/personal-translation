<h1>贝塞尔</h1>
<h2 id="intro">简介</h2>
<p>创建作为<a href="nodes-shapes-basic-line.html">基本线条</a>一部分的<strong>贝塞尔</strong>线条。</p>
<h2 id="ui">界面</h2>
<p><strong>Start Position</strong>：设置起点的位置。</p>
<p><strong>Start Offset</strong>：设置起点贝塞尔手柄的位置。</p>
<p><strong>End Position</strong>：设置终点的位置。</p>
<p><strong>End Offset</strong>：设置终点贝塞尔手柄的位置。</p>
<p><strong>Divisions</strong>：设置点之间的分割数量。</p>
