<h1>侵蚀滤镜</h1>
<h2 id="intro">简介</h2>
<p>侵蚀图层的 alpha，用于转场和蒙版调整。</p>
<h2 id="ui">界面</h2>
<p><strong>Amount</strong>：以像素为单位设置侵蚀量。</p>
<p><strong>Direction Mode</strong>：确定侵蚀的方向：</p>
<ul>
<li><strong>Uniform</strong>：向所有方向侵蚀</li>
<li><strong>Directional</strong>：沿指定的 <strong>Angle</strong> 侵蚀。</li> </ul>
<p><strong>Angle</strong>：为 <strong>Directional</strong> 侵蚀设置角度。</p>
<p><strong>Direction Strength</strong>：确定偏向指定 <strong>Angle</strong> 的程度。</p>
