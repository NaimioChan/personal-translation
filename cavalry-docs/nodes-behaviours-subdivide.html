<h1>细分</h1>
<h2 id="intro">简介</h2>
<p>为几何体添加细分，并平滑由此产生的路径。</p>
<h2 id="ui">界面</h2>
<p><strong>Smooth Angle</strong>：过滤掉其边缘相接角度<strong>大于</strong>该值的点。</p>
<p><strong>Subdivisions</strong>：设置要添加的细分数。</p>
<p><strong>Threshold</strong>：设置两个细分点之间的距离，超过该距离后便不再继续细分。</p>
<p><strong>Curve to End Points</strong>：勾选后，可改善开放路径两端处生成的曲线。</p>
