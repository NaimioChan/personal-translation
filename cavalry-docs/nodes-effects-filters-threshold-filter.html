<h1>阈值滤镜</h1>
<h2 id="intro">简介</h2>
<p>Threshold 滤镜将所有比阈值更亮的像素转换为白色，所有比阈值更暗的像素转换为黑色。它可以用来创建高对比度的黑白效果。</p>

<img src="https://cavalry.studio/docs/assets/images/filter-threshold-675a08f4b70bd081d522dd37d37fd41f.png" alt="" loading="lazy">

<h2 id="ui">界面</h2>
<p><a href="nodes-effects-filters-common-attributes-filters.html">通用属性</a> +</p>
<p><strong>Threshold</strong>：设置用于判断像素偏亮还是偏暗的阈值。</p>
