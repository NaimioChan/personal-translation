<h1>合并</h1>
<h2 id="intro">简介</h2>
<p>从两个包含开放路径的图形，创建一个包含闭合路径的图形。</p>
<h2 id="ui">界面</h2>
<p><a href="nodes-shapes-common-attributes.html">通用属性</a> +</p>
<p><strong>First Shape</strong>：连接一个包含单条开放路径的图形。</p>
<p><strong>Second Shape</strong>：连接一个包含单条开放路径的图形。</p>
<p><strong>Reverse Second Shape</strong>：反转第二个图形的路径方向。</p>
