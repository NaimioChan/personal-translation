<h1>渐变映射滤镜</h1>
<h2 id="intro">简介</h2>
<p>根据输入的亮度生成渐变。</p>
<p>图形的色调范围（从暗到亮）会被映射到渐变的颜色（从左到右）。</p>
<figure>
<img src="https://cavalry.studio/docs/assets/images/filter-gradientMap-d4b21c310355d50d86c2df8d205606ab.png" alt="" loading="lazy">
<figcaption>摄影：Brandon Romanchuk，来自 Unsplash</figcaption></figure>
<h2 id="ui">界面</h2>
<p><a href="nodes-effects-filters-common-attributes-filters.html">通用属性</a> +</p>
<p><strong>Reverse</strong>：反转 <strong>Gradient</strong> 的方向。</p>
<p><strong>Premultiply</strong>：勾选后，透明像素的计算会采用预乘。</p>
<p><strong>Gradient Mode</strong>：为 <strong>Gradient</strong> 选择一种插值方式。参见<a href="user-interface-menus-window-menu-attribute-editor-widgets-gradient.html">渐变</a>。</p>
<p><strong>Gradient</strong>：设置<a href="user-interface-menus-window-menu-attribute-editor-widgets-gradient.html">渐变</a>的色标。</p>
