<h1>黑白滤镜</h1>
<h2 id="intro">简介</h2>
<p>将图像转换为灰度。</p>
<figure>
<img src="https://cavalry.studio/docs/assets/images/filter-black-and-white-4734d6ae3292a973838bbcc46c30359f.png" alt="" loading="lazy">
<figcaption>摄影：Marek Piwnicki，来自 Unsplash</figcaption></figure>
<h2 id="ui">界面</h2>
<p>向右或向左移动六个色彩滑块，可提亮或压暗图形中相应的色调。例如，将 <strong>Reds</strong> 滑块移到 0 会使图像中的所有红色调偏向黑色。</p>
<p><strong>Reds</strong>：提亮或压暗红色调。</p>
<p><strong>Yellows</strong>：提亮或压暗黄色调。</p>
<p><strong>Greens</strong>：提亮或压暗绿色调。</p>
<p><strong>Cyans</strong>：提亮或压暗青色调。</p>
<p><strong>Blues</strong>：提亮或压暗蓝色调。</p>
<p><strong>Magentas</strong>：提亮或压暗品红色调。</p>
