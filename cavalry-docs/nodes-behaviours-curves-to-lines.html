<h1>曲线转直线</h1>
<h2 id="intro">简介</h2>
<p>将贝塞尔曲线转换为多边形直线。</p>
<h2 id="ui">界面</h2>
<p><strong>Lines per Curve</strong>：设置贝塞尔点之间使用的细分数目。</p>
<blockquote>
<p><b>示例：</b></p>
<ol>
<li>创建一个<a href="nodes-shapes-text-shape.html">文本图形</a>。</li>
<li>使用 <strong>Deformers</strong> 属性旁的 <code>+</code>，添加一个 <strong>Curves to Lines</strong> 行为。</li>
<li>将 <strong>Lines per Curve</strong> 设置为 1。</li> </ol></blockquote>
