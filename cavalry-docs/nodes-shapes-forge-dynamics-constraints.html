<h1>约束</h1>
<h2 id="intro">简介</h2>
<p><strong>Constraints</strong> 可与 <a href="nodes-shapes-forge-dynamics-forge-dynamics-shape.html">Forge Dynamics</a> 模拟结合使用，以绑定图形的位置。</p>
<p>它们可以通过<a href="user-interface-menus-window-menu-add-layers-window.html">添加图层</a>窗口添加，也可以在查看 <a href="nodes-shapes-forge-dynamics-forge-dynamics-shape.html">Forge Dynamics 图形</a> 的 <strong>Bodies</strong> 选项卡下的设置时，通过 <code>+</code> 图标添加。</p>
<h2 id="types-of-constraints">约束类型</h2>
<p><a href="nodes-utilities-bridge-constraint.html">桥接约束</a>：将图形链接在一起。</p>
<p><a href="nodes-utilities-distance-constraint.html">距离约束</a>：将图形约束在其原始位置。</p>
<p><a href="nodes-utilities-pin-constraint.html">固定约束</a>：将图形固定在其位置。</p>
