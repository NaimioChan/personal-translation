<h1>伽马校正滤镜</h1>
<h2 id="intro">简介</h2>
<p>应用伽马曲线，以调整图像的感知亮度或暗度。</p>
<h2 id="ui">界面</h2>
<p><a href="nodes-effects-filters-common-attributes-filters.html">通用属性</a> +</p>
<p><strong>Premultiply</strong>：勾选后，透明像素的计算会采用预乘。</p>
<p><strong>Gamma Value</strong>：伽马曲线按 <code class="math">output = input^{gammaValue}</code> 计算。<strong>Gamma Value</strong> 为 2.2 时，高光与阴影之间会呈现平衡或“中性”的色调。</p>
