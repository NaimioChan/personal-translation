<h2 id="vst-3-inspector">VST 3 Inspector</h2>
<p>作为跨平台源代码：用 VSTGUI 构建的简单跨平台（Win/macOS/Linux）宿主程序，它会扫描 <strong>VST 3</strong> 文件夹，从工厂收集每个 <strong>VST 3</strong> 插件的信息，并在其 UI 中显示。</p>
<p><img alt="what_if_7" src="https://steinbergmedia.github.io/vst3_dev_portal/resources/what_is_7.jpg"/></p>
