<h2 id="validator-command-line-1">Validator 命令行</h2>
<p>作为跨平台源代码：<em><strong>validator</strong></em> 是一个小型命令行宿主程序（包含源代码），可用于检查你的插件是否符合 <strong>VST 3</strong> 规范。你也可以编写自己的测试代码并让 <strong>validator</strong> 执行它。</p>
<p>非常适合集成到自动化构建服务器中。</p>
