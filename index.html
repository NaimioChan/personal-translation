<!doctype html>
<html lang="zh-CN" data-theme="anthropic" data-font="auto">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>非茗的翻译文档库</title>
  <meta name="description" content="非茗的翻译文档库">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23FAF9F5'/%3E%3Crect x='2.75' y='1.75' width='10.5' height='12.5' fill='none' stroke='%23D97757' stroke-width='1.5'/%3E%3Cpath d='M5.25 5.25h5.5M5.25 8h5.5M5.25 10.75h3' stroke='%23D97757' stroke-width='1.2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/theme.css">
  <script src="assets/settings.js"></script>
</head>

<body>

  <header class="topbar">
    <a class="brand" href="index.html">非茗的翻译文档库</a>
    <a class="github-link" href="https://github.com/NaimioChan/personal-translation" target="_blank" rel="noreferrer noopener" aria-label="GitHub 仓库">
      <svg viewBox="0 0 16 16" width="14" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
      </svg>
    </a>
    <span class="topbar-spacer"></span>
    <span id="settings-slot"></span>
  </header>

  <main class="wrap">
    <h1>非茗的翻译文档库</h1>
    <p
    <p class="lede">
      该仓库由非茗创建，用于将无中文版本的的在线文档翻译为中文并保存。
    </p>
    <p class="lede">
      由于仓库由创建者手动管理，仓库内的文档具有较弱时效性，如需参考请核实相应文档翻译版本的最后更新日期。
    </p>
    <p class="lede">
      目前所有翻译工作由AI Agent完成。如有增库或勘误需求，请前往<a href="https://github.com/NaimioChan/personal-translation/issues" target="_blank" rel="noreferrer noopener">Issue</a>。
    </p>
    <input id="filter" class="filter" type="search" placeholder="筛选文档库" aria-label="筛选文档库">
    <ul class="libs" id="libs"></ul>
    <p class="empty" id="empty" hidden></p>

    <p class="footnote">共 <span id="count">0</span> 个文档库。</p>
  </main>

  <script src="assets/libraries.js"></script>
  <script>
    (function () {
      var libs = window.PT_LIBRARIES || [];
      var list = document.getElementById('libs');
      var empty = document.getElementById('empty');
      var count = document.getElementById('count');
      var filter = document.getElementById('filter');

      count.textContent = libs.length;
      if (!libs.length) {
        empty.hidden = false;
        empty.textContent = '什么都没有哦。';
      }

      libs.forEach(function (lib) {
        var li = document.createElement('li');

        var a = document.createElement('a');
        a.className = 'lib-title';
        a.href = lib.dir.replace(/\/+$/, '') + '/index.html';
        a.textContent = lib.title || lib.dir;
        li.appendChild(a);

        if (lib.desc) {
          var d = document.createElement('p');
          d.className = 'lib-desc';
          d.textContent = lib.desc;
          li.appendChild(d);
        }

        var meta = document.createElement('p');
        meta.className = 'lib-meta';
        if (lib.source) {
          var s = document.createElement('span');
          var sa = document.createElement('a');
          sa.href = lib.source;
          sa.rel = 'noreferrer noopener';
          sa.textContent = '原文';
          s.appendChild(sa);
          meta.appendChild(s);
        }
        if (lib.updated) {
          var u = document.createElement('span');
          u.textContent = '更新于 ' + lib.updated;
          meta.appendChild(u);
        }
        if (lib.pages) {
          var p = document.createElement('span');
          p.textContent = lib.pages + ' 页';
          meta.appendChild(p);
        }
        if (meta.children.length) li.appendChild(meta);

        list.appendChild(li);
      });

      filter.addEventListener('input', function () {
        var q = filter.value.trim().toLowerCase();
        var shown = 0;
        [].forEach.call(list.children, function (li) {
          var hit = !q || li.textContent.toLowerCase().indexOf(q) >= 0;
          li.hidden = !hit;
          if (hit) shown++;
        });
        if (libs.length && !shown) {
          empty.hidden = false;
          empty.textContent = '没有匹配的文档库。';
        } else if (libs.length) {
          empty.hidden = true;
        }
      });
    })();
  </script>

</body>

</html>
