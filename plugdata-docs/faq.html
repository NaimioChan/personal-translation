    <h1>常见问题</h1>

    <p><strong>问：我可以在 plugdata 里使用外部对象吗？</strong></p>

    <p>答：<strong>plugdata</strong> 内置了 ELSE、Cyclone、Heavy 和 pdlua 库。在 <strong>plugdata</strong> 的独立应用里，你可以使用其他任何外部对象。遗憾的是，在 DAW 里使用 plugdata 时无法使用外部对象。</p>

    <p><br></p>

    <p><strong>问：plugdata 在我的 DAW 里对键盘输入没有反应，帮帮我！</strong></p>

    <p>答：参见<a href="troubleshooting.html#keyboard-input-in-daw-not-working">在 DAW 中键盘输入不工作</a></p>
