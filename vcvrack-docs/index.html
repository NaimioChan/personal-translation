<h1>VCV Rack 手册</h1>
<p>这是 <a href="https://vcvrack.com/Rack" rel="noreferrer noopener">VCV Rack</a> 的手册，它是适用于 Windows/Mac/Linux 的虚拟 Eurorack 工作室。</p>
<p>要查阅某个模块的手册，请在 <a href="https://library.vcvrack.com/" rel="noreferrer noopener">VCV Library</a> 中找到该模块，然后点击“User manual”链接。
或者在 VCV Rack 中右键点击该模块，并选择“Plugin &gt; Manual”。</p>
