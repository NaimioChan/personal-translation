    <h1>标签</h1>
<p>每个操作符都可以有一组文本字符串作为其「标签」。例如，标签可用于归类和收集某个用户自定义分类的组件，如「color filter」或「audio effect」。 </p><p>可以在界面中 Parameter 对话框的顶部为操作符设置标签，也可以通过 python 设置，例如 <code dir="ltr"><span>node</span><span>.</span><span>tags</span> <span>=</span> <span>[</span><span>'tag 1'</span><span>,</span> <span>'tag 2'</span><span>]</span></code> </p><p>可以使用 <code>OP.findChildren()</code> 方法和 <a href="OP_Find_DAT.html">OP Find DAT</a> 搜索带特定标签的操作符。 </p><p>参见 <a href="OP_Class.html">OP_Class</a> </p>
