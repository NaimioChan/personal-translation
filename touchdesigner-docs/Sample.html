    <h1>采样</h1>
<p>在 TouchDesigner 中，"sample" 有两种含义。 </p><p>在 CHOP 中，它是一个单独的数字，一系列采样构成一个通道。 </p><p>在音频领域，"sample" 通常指 TouchDesigner 中所谓的通道，或立体声音频中的两个通道。在 TouchDesigner 中，我们将其称为一个 CHOP，它容纳两个通道，并具有一定的时间长度，以（Touch 风格的）采样、秒或帧来度量。 </p><p>在 TOP 的语境中，我们有时会说「对图像采样」。 </p>
