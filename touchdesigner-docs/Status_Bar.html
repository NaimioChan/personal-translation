    <h1>状态栏</h1>
<p>状态栏位于 TouchDesigner 界面顶部、菜单的右侧。</p><p>状态栏会显示 TouchDesigner 在某些事件成功或失败时的消息。</p><p>你可以使用 <i>status</i> 命令在状态栏中显示任意消息。</p><p><a href="https://docs.derivative.ca/File:Statusbar.jpg" rel="noreferrer noopener" target="_blank"><img alt="Statusbar.jpg" height="20" src="https://docs.derivative.ca/images/0/03/Statusbar.jpg" width="870"/></a> </p>
