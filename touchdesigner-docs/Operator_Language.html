    <h1>操作符语言</h1>
<p>操作符的 Language Mode 控制操作符参数表达式所使用的脚本语言，对于 <a href="DAT.html">DATs</a> 而言，也控制 DAT 内容所使用的语言。 </p><p>可以使用每个操作符参数对话框顶部的 <b>Language</b> 按钮，在默认的 <a href="Python.html">Python</a> 与已弃用的 <a href="https://docs.derivative.ca/Tscript" rel="noreferrer noopener" target="_blank">Tscript</a> 之间切换模式。 </p><p>请注意，DAT 查看器中文本的颜色会随 Language Mode 变化，蓝色 = python，紫色 = tscript。 </p><h4 id="Python_Mode">Python 模式</h4><p><a href="https://docs.derivative.ca/File:TextDATPython.png" rel="noreferrer noopener" target="_blank"><img alt="Python Mode" height="531" src="https://docs.derivative.ca/images/e/e8/TextDATPython.png" width="429"/></a> </p><h4 id="Tscript_Mode">Tscript 模式</h4><p><a href="https://docs.derivative.ca/File:TextDATtscript.png" rel="noreferrer noopener" target="_blank"><img alt="Tscript Mode" height="531" src="https://docs.derivative.ca/images/3/3c/TextDATtscript.png" width="430"/></a> </p>
