    <h1>Dongle 类</h1>
<p>用于与系统中连接的单个加密狗交互的类。 </p><h2 id="Members">成员</h2><div id="serialNumber"></div><p><code>serialNumber</code> → <code>str</code> <b>(Read Only)</b>: </p><blockquote><p>加密狗序列号。</p></blockquote><h2 id="Methods">方法</h2><div id="applyUpdate"></div><p><code>applyUpdate(str)</code>→ <code>None</code>: </p><blockquote><p>以字符串形式接收更新并将其应用到加密狗。</p></blockquote><div id="createUpdateContext"></div><p><code>createUpdateContext()</code>→ <code>str</code>: </p><blockquote><p>返回一个字符串，即该加密狗的远程编程更新上下文。</p></blockquote>
