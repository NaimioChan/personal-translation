    <h1>新建项目对话框</h1>
<p><a href="https://docs.derivative.ca/File:NewProjectDialog.png" rel="noreferrer noopener" target="_blank"><img alt="NewProjectDialog.png" height="129" src="https://docs.derivative.ca/images/e/e4/NewProjectDialog.png" width="500"/></a> </p><p>允许你在磁盘上创建新的 TouchDesigner 项目文件夹结构。系统会提示你输入新 TouchDesigner 项目的路径和文件夹名。</p><p>点击 <b>Cancel</b> 按钮可在不提交任何更改的情况下退出对话框。按下 <b>Accept</b> 后，会在<b> Path</b> 指定的位置创建新文件夹。文件夹将以 <b>Project Name</b> 参数命名。</p>
