    <h1>Pickable 标记</h1>
<p>Pickable 标记用于在 <a href="Geometry_Viewer.html">3D Geometry Viewers</a> 和 <a href="SOP_Editor.html">SOP Editors</a> 中选择几何。只有在 Pickable 标记打开时才能选择几何。Pickable 标记是橙色的，只出现在 <a href="Object.html">Object COMPs</a> 上。 </p><p>另请参阅 <a href="Flag.html">Flag</a>。 </p>
