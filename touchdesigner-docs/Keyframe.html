    <h1>关键帧</h1>
<p>在 <a href="Animation_COMP.html">Animation component</a> 中，每个关键帧指定某个通道在特定时间（或帧）的值。关键帧保存一个值、入射/出射斜率与加速度，以及一种插值类型。</p><p>通道的关键帧用于插值，并确定从 <a href="Animation_COMP.html">Animation COMP</a> 输出的每个通道所有采样的值。</p><p>另请参阅 <a href="Animation_Editor.html">Animation Editor</a> 和 <a href="Animation_COMP.html">Animation COMP</a>。</p>
