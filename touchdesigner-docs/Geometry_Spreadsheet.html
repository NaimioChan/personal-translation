    <h1>几何数据表</h1>
<p><b>Geometry Spreadsheet</b> 曾是 TouchDesigner 的 <a href="Pane.html">Pane</a> 类型之一。使用 Pane Type Menu 或 <b>Alt+7</b> 快捷键切换到 Geometry Spreadsheet。 </p><p>目前请使用 <a href="SOP_to_DAT.html">SOP to DAT</a> 查看 SOP 数据值。它会显示 SOP 中点或 <a href="Primitive.html">Primitives</a> 的详细信息。 </p><p>过时： </p><p><a href="https://docs.derivative.ca/File:Pane_Type_Menu_Geo_Spreadsheet.jpg" rel="noreferrer noopener" target="_blank"><img alt="Pane Type Menu Geo Spreadsheet.jpg" height="252" src="https://docs.derivative.ca/images/f/f8/Pane_Type_Menu_Geo_Spreadsheet.jpg" width="234"/></a> </p><p><a href="https://docs.derivative.ca/File:Geometry_Spreadsheet.jpg" rel="noreferrer noopener" target="_blank"><img alt="Geometry Spreadsheet.jpg" height="463" src="https://docs.derivative.ca/images/6/63/Geometry_Spreadsheet.jpg" width="833"/></a> </p>
