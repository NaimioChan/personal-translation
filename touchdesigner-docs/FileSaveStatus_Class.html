    <h1>FileSaveStatus 类</h1>
<p>此类包含 OP 保存任务的状态信息。可转换为 str 类型以返回已保存文件的文件路径。</p><h2 id="Members">成员</h2><div id="filePath"></div><p><code>filePath</code> → <code>str</code> <b>(Read Only)</b>: </p><blockquote><p>返回已保存文件的文件路径。</p></blockquote><div id="op"></div><p><code>op</code> → <code>OP</code> <b>(Read Only)</b>: </p><blockquote><p>返回对已保存的 OP 节点的引用。</p></blockquote><h2 id="Methods">方法</h2><div id="isCompleted"></div><p><code>isCompleted()</code>→ <code>bool</code>: </p><blockquote><p>若文件保存完成则返回 true，否则返回 false。</p></blockquote>
