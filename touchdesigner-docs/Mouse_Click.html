    <h1>鼠标点击</h1>
<p><b>LMB</b> 等同于 <b>left-click</b> 或 <b>lclick</b>，意思是「点击鼠标左键」。 </p><p><b>MMB</b> 等同于 <b>middle-click</b> 或 <b>mclick</b>。<b>注意</b>：如果你没有中键，请按 Alt+右键。 </p><p><b>RMB</b> 等同于 <b>right-click</b> 或 <b>rclick</b>，有时称为「上下文菜单」或「选项菜单」。 </p><p>TouchDesigner 使用三键鼠标。 </p><p>另请参阅 <a href="RMB_Menu.html">RMB Menu</a>。 </p>
