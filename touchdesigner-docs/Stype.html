    <h1>Stype</h1>
<h2 id="Overview">概述</h2><p><a href="https://stype.tv/" rel="noreferrer noopener" target="_blank">Stype</a> 是一家生产 <b>RedSpy</b> 硬件产品的公司，这些产品配合实体摄像机工作并追踪其位置、旋转和取景/镜头属性，再结合 TouchDesigner 3D 渲染，就能把虚拟图形叠加到实拍摄像机画面上。</p><p>TouchDesigner 可以使用通过以太网 UDP 连接发送的 Stype 跟踪数据来控制虚拟摄像机，并为渲染图像添加模拟镜头畸变。</p><p>见 <a href="Stype_TOP.html">Stype TOP</a>、<a href="https://docs.derivative.ca/Stype_CHOP" rel="noreferrer noopener" target="_blank">Stype CHOP</a> 和 <a href="FreeD_In_CHOP.html">FreeD In CHOP</a>。</p>
