    <h1>SOP 编辑器</h1>
<h2 id="Description">说明</h2><p>SOP Editor 允许你在 <a href="SOP.html">SOPs</a> 中选择、创建和编辑几何。 </p><p>要打开 SOP Editor，右键单击任意 SOP 并选择 <b>Model Geometry</b>。 这会锁定该节点，并在浮动窗格中打开 SOP Editor。 对于 <a href="Group_SOP.html">Group SOP</a>，菜单项是 <b>Select Geometry</b>。 此时 SOP 不会被锁定，但你可以选择几何并把所选内容传递给 Group SOP。 </p><h2 id="Interface">界面</h2><div><div><a href="https://docs.derivative.ca/File:SOPEditor.jpg" rel="noreferrer noopener" target="_blank"><img alt="SOPEditor.jpg" height="545" src="https://docs.derivative.ca/images/d/d5/SOPEditor.jpg" width="800"/></a></div></div><h2 id="See_Also">另请参阅</h2><p>另请参阅 <a href="Group_SOP.html">Group SOP</a> </p>
