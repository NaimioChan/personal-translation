    <h1>.tox 组件文件</h1>
<p>.tox 文件是一种 <b>TouchDesigner Component file</b>，即用于保存 TouchDesigner 项目中 <a href="https://docs.derivative.ca/index.php?title=Components&amp;action=edit&amp;redlink=1" rel="noreferrer noopener" target="_blank">components</a> 的文件类型。一个 .tox 文件包含一个组件，而该组件又可以包含多个组件。之后就可以在其他项目中按需加载这个组件文件。例如，在为项目设计自定义用户界面时，把 UI 元素保存为单独的 .tox 文件，就能在以后的项目中轻松复用界面的各个部分。</p><p>另请参阅 <a href=".toe.html">.toe</a>。</p>
