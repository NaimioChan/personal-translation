    <h1>Tuplet</h1>
<p>一个 tuplet 是参数对话框中一行上的 <a href="Parameter.html">parameters</a> 集合。 </p><p>例如，在 Transform SOP 上，tuplet <code>t</code> 包含参数 <code>tx</code>、<code>ty</code> 和 <code>tz</code>。 </p><p>一个 tuplet 可以包含一个参数。这种情况下，tuplet 名称就是参数名称。 </p><p>Tuplet 会占用参数的一个 <a href="Page_Class.html">page</a>。 </p><p>另请参阅：<a href="Page_Class.html">Page_Class</a> </p>
