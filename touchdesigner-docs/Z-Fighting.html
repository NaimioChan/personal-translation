    <h1>Z 冲突</h1>
<p>Z-Fighting 发生在两个多边形共面时，也就是说它们实际上占据了空间中的同一位置。Z-Fighting 是显卡无法以一致的方式判断哪个多边形在前的结果。通常的表现是一个多边形的某些部分可见，而另一个多边形的其他部分可见。可以通过稍微偏移其中一个几何体的位置，或使用 <a href="Polygon_Depth_Offset.html">Polygon Depth Offset</a> 来避免。 </p>
