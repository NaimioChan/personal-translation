    <h1>Synth</h1>
<p><b>Synths</b> 是 TouchDesigner 创作的艺术作品的旧称。一个 Synth 由 TouchDesigner 创建的 <a href=".toe.html">.toe</a> 文件，以及在 <a href="TouchPlayer.html">TouchPlayer</a> 中、或在 <a href="Perform_Mode.html">Perform Mode</a>、<a href="TouchDesigner.html">TouchDesigner</a> 中运行该作品所需的所有相关媒体文件组成。 </p><p>TouchDesigner 017 的 synth 存档（约 2007 年）可在此处获取 <a href="http://www.derivativeinc.com/Artworks/Catalog.asp?page=NewReleasesRetrieveRandomOther.asp" rel="noreferrer noopener" target="_blank">here</a>。（链接已失效，请联系 Derivative） </p>
