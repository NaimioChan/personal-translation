    <h1>MoSys</h1>
<p><a href="https://www.mo-sys.com/" rel="noreferrer noopener" target="_blank">MoSys</a> 创建用于跟踪物理摄像机及其镜头属性的系统。 </p><p><a href="https://docs.derivative.ca/File:Mo-sys_Logo_sm.jpg" rel="noreferrer noopener" target="_blank"><img alt="Mo-sys Logo sm.jpg" height="112" src="https://docs.derivative.ca/images/thumb/3/31/Mo-sys_Logo_sm.jpg/300px-Mo-sys_Logo_sm.jpg" srcset="/images/3/31/Mo-sys_Logo_sm.jpg 1.5x" width="300"/></a> </p><p>Mo-Sys Startracker 是一种专业的虚拟制作摄像机跟踪方案，在广播和电影制作现场很受欢迎。该系统基于标记的光学跟踪器，提供 6 轴跟踪以及镜头变焦和对焦。我们新增的 <a href="MoSys_CHOP.html">MoSys CHOP</a> 接收来自摄像机跟踪系统的数据，其通道可用于控制虚拟摄像机，而 <a href="MoSys_TOP.html">MoSys TOP</a> 可用于应用正确的镜头畸变。 </p>
