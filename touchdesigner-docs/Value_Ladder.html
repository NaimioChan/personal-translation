    <h1>值阶梯</h1>
<p>Value Ladders 允许你用鼠标更改数值参数的值。按住参数值字段或标签上的 <a href="Mouse_Click.html">MMB</a>（或者按住 <a href="Mouse_Click.html">LMB</a>）可打开数值梯级。数值梯级会弹出 .01 .1 1 10 100 选项。保持鼠标中键按下，移到其中一个 10 的幂上，然后向右/左拖动以按该增量增加/减少值。 </p><p><a href="https://docs.derivative.ca/File:ValueLadder.png" rel="noreferrer noopener" target="_blank"><img alt="ValueLadder.png" height="104" src="https://docs.derivative.ca/images/f/fd/ValueLadder.png" width="37"/></a> </p>
