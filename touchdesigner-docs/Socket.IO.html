    <h1>Socket.IO</h1>
<p>Socket.IO 支持实时、双向、基于事件的通信。它可在所有平台、浏览器或设备上工作，同样注重可靠性和速度。<sup id="cite_ref-1"><a href="#cite_note-1">[1]</a></sup></p><p>创建 Socket.IO 服务器应用的常用框架是 <a href="https://nodejs.org/" rel="noreferrer noopener" target="_blank">Node.js</a> - 一个基于 Chrome V8 JavaScript 引擎构建的 JavaScript 运行时。</p><p>请参阅 <a href="SocketIO_DAT.html">SocketIO DAT</a>。</p><h2 id="References">参考</h2><div><ol><li id="cite_note-1"><span><a href="#cite_ref-1">↑</a></span> <span>from <a href="https://socket.io" rel="noreferrer noopener" target="_blank">Socket.IO</a></span> </li></ol></div>
