    <h1>更改 OP 类型对话框</h1>
<p>Change OP Type 对话框可用于把 <a href="Operator.html">operator</a> 更改为同一操作符族中的另一种类型。<a href="Mouse_Click.html">RMB</a> 在任意节点上单击，从弹出菜单中选择 <b>Change OP Type...</b>，即可打开该对话框。选中所要替换成的新操作符类型并单击。 </p><p><a href="https://docs.derivative.ca/File:Change_OP_Type_Dialog.jpg" rel="noreferrer noopener" target="_blank"><img alt="Change OP Type Dialog.jpg" height="434" src="https://docs.derivative.ca/images/0/0c/Change_OP_Type_Dialog.jpg" width="618"/></a> </p><p><b>提示：</b> 如果选择相同的操作符类型，该操作符会被删除并重新创建。当操作符出错，或你希望把所有参数重置为默认值时，这是重建操作符的便捷方式。 </p><p>另请参阅 <a href="OP_Create_Dialog.html">OP Create Dialog</a> </p>
