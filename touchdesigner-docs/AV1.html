    <h1>AV1</h1>
<p><a href="https://en.wikipedia.org/wiki/AV1" rel="noreferrer noopener" target="_blank">AV1</a>（<a href="https://en.wikipedia.org/wiki/AV1" rel="noreferrer noopener" target="_blank">AOMedia Video 1</a> 编解码器）是一种开放、免版税的视频编码格式，最初是为互联网视频传输而设计的。它由 <a href="https://en.wikipedia.org/wiki/Alliance_for_Open_Media" rel="noreferrer noopener" target="_blank">Alliance for Open Media</a>（AOMedia）开发。</p><p>AV1 由 <a href="Movie_File_In_TOP.html">Movie File In TOP</a> 和 <a href="Video_Stream_In_TOP.html">Video Stream In TOP</a> 读取。它由 <a href="Movie_File_Out_TOP.html">Movie File Out TOP</a> 和 <a href="Video_Stream_Out_TOP.html">Video Stream Out TOP</a> 输出。</p>
