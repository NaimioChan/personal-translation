    <h1>边缘光</h1>
<p>轮廓光从后方或一侧照亮对象。它们有助于将对象与背景分离，使其「凸显」出来，可用于传达场景中的深度和间距。</p><p>轮廓光通常也称为背光（Back Lights）。</p><p>可以通过 <a href="Phong_MAT.html">Phong MAT</a> 材质向场景添加轮廓光。每个 Phong MAT 最多可创建 2 个轮廓光，且只在该材质上渲染。</p><p>这些功能的示例另请参阅 <a href="Using_Rim_Lights.html">Using Rim Lights</a>。</p>
