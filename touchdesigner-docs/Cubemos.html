<p><a href="RealSense_CHOP.html">RealSense CHOP</a> 使用 <a href="https://www.intelrealsense.com/skeleton-tracking/" rel="noreferrer noopener" target="_blank">Cubemos RealSense Skeleton Tracking API</a> 提供骨骼跟踪数据。 </p><p>Cubemos 也可以独立与 TouchDesigner 配合工作，接收视频流并输出包含人体跟踪数据的通道。 </p><p><b>注意</b>：必须从 Cubemos 购买 Cubemos 许可证才能使用骨骼跟踪。 </p>
