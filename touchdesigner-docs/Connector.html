    <h1>连接口</h1>
<p>每个 <a href="Node.html">Node</a> 左右两侧的凹口是连接器，让你把一个 <a href="Operator.html">Operator</a> 的输出 <a href="Wire.html">Wire</a> 到同一 <a href="Operator.html">Operator Family</a> 的另一个操作符的输入。 </p><p><a href="Object.html">3D Object Components</a> 和 <a href="Panel_Component.html">Panel Components</a> 顶部和底部的凹口是连接器，把 <a href="Hierarchy.html">Hierarchy</a> 中各子 <a href="Operator_Family.html">Family</a> 的组件连接起来。 </p><p>另请参阅 <a href="Wire.html">Wire</a>、<a href="Hierarchy.html">Hierarchy</a>。 </p>
