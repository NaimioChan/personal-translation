    <h1>安全模式</h1>
<p>当打开 TouchDesigner 崩溃时生成的 CrashAutoSave.toe 文件时，会启用 Safe Mode。 </p><p>此模式以静态状态打开文件，其中任何内容都不会 <a href="Cook.html">cook</a>。 这样你就可以编辑和浏览该文件以调查崩溃原因，而文件不会再次崩溃。 </p><p>你可以重命名任意文件，把 "CrashAutoSave" 放在名称开头，使其以 safe-mode 打开。例如：CrashAutoSave_myfilename.toe 将以 safe mode 打开。 </p>
