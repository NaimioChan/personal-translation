<h1>Alignment</h1>

<p><em>GUI 系统中的对齐选项</em></p>

<p>GUI 类中的对齐方式用以下符号表示：</p>

<ul>
<li>\left</li>
<li>\center</li>
<li>\right</li>
</ul>

<p>此外，以下符号在 Qt GUI 中可用：</p>

<ul>
<li>\topLeft</li>
<li>\top</li>
<li>\topRight</li>
<li>\bottomLeft</li>
<li>\bottom</li>
<li>\bottomRight</li>
</ul>
