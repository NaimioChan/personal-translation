<h1>表达式序列</h1>

<p><em>表达式序列</em></p>

<p>由分号分隔、并且可选地以分号结尾的一系列表达式构成单个表达式，其值为最后一个表达式的值。这样的序列可用于任何可使用普通表达式的地方。</p>

<pre><code>max( b = a * 2; b + 5,  10);    // 计算 b+5 和 10 的最大值</code></pre>

<p>在上面的示例中，序列：<code>b = a * 2; b + 5</code> 作为 <code>max()</code> 第一个参数的单个表达式。</p>
