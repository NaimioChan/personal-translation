<h1>Comments</h1>

<p><em>源代码注释</em></p>

<p>注释以 <code>//</code> 开头，直到行尾结束。注释也可以用 <code>/*</code> 和 <code>*/</code> 界定。</p>

<p>示例：</p>

<pre><code>// 单行注释

/*
    多行
    注释
    文本
*/

/*与 C 不同，你可以使用 /* 嵌套 */ comments */</code></pre>
