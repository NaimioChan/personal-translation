<h1>颜色组</h1>

<p><em>调色板中的颜色组列表及其含义</em></p>

<p>调色板（参见 <a href="Classes-QPalette.html">QPalette</a>）由分配给三个颜色组内各种颜色角色（参见 <a href="Reference-palette_color_roles.html">Color roles</a>）的颜色组成。以下是可用于表示颜色组的符号列表及其含义。</p>

<table>
<tr><td><p>Group</p></td><td><p>Meaning</p></td></tr>
<tr><td><p>'active'</p></td><td><p>包含活动窗口上视图所使用的颜色。</p></td></tr>
<tr><td><p>'inactive'</p></td><td><p>包含非活动窗口上视图所使用的颜色。</p></td></tr>
<tr><td><p>'disabled'</p></td><td><p>包含禁用视图所使用的颜色。</p></td></tr>
<tr><td><p>'normal'</p></td><td><p>'active' 的同义词。</p></td></tr>
</table>
