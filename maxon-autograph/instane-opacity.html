    <h1>实例不透明度</h1>
    <p>该参数为每个实例定义全局不透明度，它作为乘数作用于要实例化的源中已有的<code>Alpha</code>图层。</p>
    <p>这里同样有一个选项，可以让你让某个实例的不透明度相对于前一个实例逐渐变化。这个值只能在 0.0 与 1.0 之间设置，因此每个实例都会一次比一次更透明一些。</p>
    <figure style="max-width: 1920px;">
      <img src="https://help.maxon.net/ag/en-us/Content/Resources/Images/chapters/instancer/opacity.jpg" alt="" loading="lazy">
    </figure>
    <p>如果你想颠倒递减的顺序，从元素列表的另一端开始，请使用<code>索引模式</code>，或者按本节所述，为每个实例的不透明度设置修改器或生成器。</p>
