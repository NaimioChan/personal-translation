    <h1>模式循环</h1>
    <p><code>从一个模式切换到另一个模式</code>可以通过<em>多编辑模式</em>下拉菜单完成。不过有时候，能在按住鼠标按键时切换模式会很有用。</p>
    <p>为此，你可以在不松开鼠标按键的情况下，把鼠标光标<code>移到时间轴上方</code>，然后按 <kbd>c</kbd> 键跳到列表中的下一个模式。配合 <kbd>up</kbd> 和 <kbd>down</kbd> 键，你还可以实时更改这些不同模式的选项。</p>
