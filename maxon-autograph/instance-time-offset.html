    <h1>实例时间偏移</h1>
    <p><code>模板</code>部分包含一个带源的图像参数，但它也可以按实例添加修改器，例如一个<code>动画器</code>。你也可以把含有动画元素的合成用作<code>模板</code>。</p>
    <p>正如可以为每个实例定义整体变换或相对变换那样，也可以为所有实例定义一个全局<code>时间偏移</code>，或者随着实例化的推进而累积它。</p>
    <p>这样，你就可以基于一个共同的模板让动画一个接一个地触发，如下面的例子所示：</p>
