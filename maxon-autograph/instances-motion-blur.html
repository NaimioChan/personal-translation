    <h1>运动模糊</h1>
    <p>修改<code>实例变换 X</code>的参数并添加关键帧，就能让所有实例动起来。在这些运动过程中，可以计算运动模糊。</p>
    <figure style="max-width: 659px;">
      <img src="https://help.maxon.net/ag/en-us/Content/Resources/Images/chapters/instancer/motion_blur.jpg" alt="" loading="lazy">
    </figure>
    <p>这些参数与图层<em>运动模糊</em>部分中介绍的参数相同。所需的计算量可能因实例数量而变大，所以可以考虑按需要设置<code>质量</code>来优化。</p>
    <blockquote>
      <p><b>注意：</b>你还可以在<code>查看器</code>中临时禁用运动模糊计算，以便在设置动画时让 <em>Autograph</em> 反应更灵敏。</p>
    </blockquote>
