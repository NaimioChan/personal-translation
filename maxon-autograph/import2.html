    <h1>导入素材</h1>
    <p>要导入 3D 素材（.usd、.usda、.usdc），请点击<code>项目面板</code>中的<code>导入文件</code>菜单，然后选择<code>添加 3D 素材</code>：</p>
    <figure style="max-width: 462px;">
      <img src="https://help.maxon.net/ag/en-us/Content/Resources/Images/chapters/3D_environment/import/Import.jpeg" alt="" loading="lazy">
    </figure>
    <p>你也可以把 3D 素材直接拖放到<code>项目面板</code>中</p>
    <blockquote>
      <p><b>注意：</b>这并不是真正的导入，而只是链接到该文件。</p>
    </blockquote>
