    <h1>多维度</h1>
    <p><em>实例器</em>允许你定义多维空间，最多 4 维。每个维度都有自己的“实例变换”参数。</p>
    <p>例如，我们可以先定义 5 张牌的一种分布，然后以这个分布为基础，按照第二个维度再分布三次。</p>
    <figure style="max-width: 1280px;">
      <img src="https://help.maxon.net/ag/en-us/Content/Resources/Images/chapters/instancer/multiple_dimensions.jpg" alt="" loading="lazy">
    </figure>
    <p>再加上第三个维度，我们就可以用这个由 15 张牌组成的区块，通过“实例变换 3”再次实例化它，等等……</p>
