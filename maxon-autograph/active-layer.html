    <h1>活动图层</h1>
    <p>在<em>堆栈</em>中选中多个图层时，你会注意到最后选中的图层颜色不同。这就是所谓的<em>活动图层</em>：</p>
    <figure style="max-width: 1065px;">
      <img src="https://help.maxon.net/ag/en-us/Content/Resources/Images/chapters/layer/active.jpg" alt="" loading="lazy">
    </figure>
    <p>这样可以执行一些让多个图层参照活动图层的操作，例如：</p>
    <ul>
      <li>把活动图层用作<em>遮罩</em></li>
      <li>建立一种<em>父子关系</em>，其中活动图层是<em>父级</em></li>
    </ul>
    <p>要做到这一点，只需选中你想要的图层并点击<em>操作</em>按钮：</p>
    <figure style="max-width: 1065px;">
      <img src="https://help.maxon.net/ag/en-us/Content/Resources/Images/chapters/layer/active_action.jpg" alt="" loading="lazy">
    </figure>
    <blockquote>
      <p><b>注意：</b>在使用<a href="uniform-relative.html">多编辑模式</a>时，<em>活动图层</em>这一概念也很重要。</p>
    </blockquote>
