    <h1>什么是 puredata.info？</h1>
    <p><a href="https://puredata.info">Pure Data Dot Info</a> 是面向 Pd 用户社区的一个内容管理程度很高的信息来源。</p>
<p>它运行在 <a href="http://plone.org">Plone</a> 上。它由一批志愿者维护，托管在奥地利格拉茨的 <a href="http://www.iem.at">IEM</a>。</p>
<p>它以前叫 pure-data dot org，但那个域名被一些不怀好意的人从我们手里抢走了。</p>
