    <h1>我能把 Pd 和插件一起用吗？</h1>
    <p>可以。Pd 与 LADSPA、DSSI 和 VST 插件配合得很好（不过 DirectX 插件不行）。你需要下载并安装单独的 <code>[plugin~]</code> 对象，或者用于 DSSI 插件的 <code>[dssi~]</code> 对象。另外，目前还无法把 Pd 本身当作插件使用，但有不少人在做这方面的工作，包括把 Pd 用作浏览器插件。</p>
    <p>从 Pd 0.43 起，你还可以用插件自定义 Pd 的 GUI。这些被称为 <a href="https://puredata.info/docs/developer/GuiPlugins">GUI 插件</a></p>
