    <h1>为什么所有声音听起来都这么「失真」？</h1>
    <p>声音是连续的（没有咔哒声或爆音），但听起来失真。</p>
    <p>可能是你播放的声音对你的声卡来说太响了。</p>
    <p>用声卡上的控制项<em>调低播放音量</em>。</p>
    <p>另外要确认 Pd 中使用的<em>采样率</em>与你的声卡相匹配。</p>
