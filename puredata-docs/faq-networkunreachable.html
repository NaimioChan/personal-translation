    <h1>运行 Pd 时出现「Network is unreachable」？</h1>
    <p>如果你在启动 Pd 时看到错误消息「connecting stream socket: Network is unreachable」，说明你的机器无法与自身建立网络连接。 </p>
<p>你必须配置回环网络设备。 </p>
<p>在许多 Linux 发行版中，你可以这样解决：当系统配置工具询问该机器是否会「联网」时回答「yes」（即使它不会联网）。</p>
