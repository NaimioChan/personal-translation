    <h1>Pd-extended 与 Pd-vanilla（Miller Puckette 的版本）兼容吗？</h1>
    <p>目标是让它与 Pd-vanilla 完全兼容。话虽如此，开发过程中有可能引入不兼容之处，这些应当作为 bug 报告。不过 Pd-vanilla 并不总是与 Pd-extended 兼容，因为 Pd-extended 有一些 Pd-vanilla 没有的额外功能。</p>
