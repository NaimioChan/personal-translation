    <h1>如何创建一条 FAQ 条目？</h1>
    <p>有一个很多人问过、却还没有被收录的问题。我要怎样添加一条 FAQ？</p>
    <p>首先，你同样需要有这里的账号。然后登录，进入 FAQ 主页面，点击右上角的 "add faq" 按钮。按照提示添加问题和答案。请注意：这里的 FAQ 使用 "Structured Text" 格式。</p>
