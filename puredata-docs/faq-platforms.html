    <h1>Pd 可以运行在哪些平台上？</h1>
    <p>Pd 已成功运行在 MacOS X、多种版本的 GNU/Linux、Windows 9x、Windows 2000/XP、SGI IRIX 和 FreeBSD 上。
<br/>
<br/>任何类 UNIX 操作系统，只要该平台上能运行 Tcl/Tk，就应该能运行 Pd。 
<br/>Pd 大概永远不会运行在 MacOS 9 或更早的版本上。</p>
