    <h1>在哪里能找到 pd 中所有原生对象的列表？</h1>
    <p>并没有一份确定的列表，不过你也可以查看随 pd 一起发布的文档中的 /doc/5.reference/help-intro.pd（旧版本中是 /doc/5.reference/0.INTRO.txt）。在 patch 的背景上右键，选择 "Help" 就能打开它。</p>
    <p>在那里顺便取得 /doc/5.reference/ 文件夹的目录列表，找出 help-intro.pd 中还没有提到的对象。</p>
