    <h1>Pd 要多少钱？</h1>
    <p>Pd 是自由软件。Pd 源代码发布所依据的具体许可证与 BSD 许可证类似。这意味着 Pd 可以免费获取。你也可以自由修改和分享源代码，只要你不剥夺他人同样的自由。</p>
    <p>令人高兴的是，你会发现与 Pd 相关的软件大多（即使不是全部）也同样获得了自由，多数以 <a href="http://www.gnu.org/copyleft/copyleft.html">GNU GPL</a> 发布</p>
    <p>话虽如此，开发者也要吃饭，所以你为自由软件贡献的任何东西都会让它变得更好，也会让事情推进得更快。</p>
