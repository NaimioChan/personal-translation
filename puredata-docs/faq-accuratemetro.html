    <h1>如何从 metro 获得更精确的计时？</h1>
    <p>如果你用 <code>pd -noaudio</code> 运行，会发现定时器误差小了很多，但这样 Pd 当然就不会产生音频了。0.33 版本的发行说明里有一段关于降低延迟的讨论，可能有用。试着减小块大小、sleep grain，或者以 stream 模式运行。</p>
