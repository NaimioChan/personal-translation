    <h1>我能在 GNU/Linux 上运行 Pd 吗？</h1>
    <p>可以。Pd 在任何相当新的 Linux 版本上都工作得很好。OSS 和 ALSA 驱动得到完整支持。想要最好的效果，请为低延迟运行给你的内核打补丁。
