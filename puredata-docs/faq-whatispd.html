    <h1>什么是 Pd？</h1>
    <p><em>Pd</em> 是 <em>Pure Data</em> 的缩写。</p>
<p>Pd 是一套用于现场音乐与多媒体演出的实时软件系统。它由 Miller Puckette 以及可能还有其他人在积极开发。这套系统尚未完成，但对复杂的项目已经相当可用。它已被移植到 GNU/Linux、MacOS X、IRIX、BSD 以及多种版本的 Windows 上。</p>
