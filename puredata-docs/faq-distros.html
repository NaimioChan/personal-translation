    <h2>Pd-vanilla</h2>
    <p>   这是 Miller 维护的源代码。它包含一组基本的对象</p>
    <h2>Pd-extended</h2>
    <p>   这是 <strong>Pd-core</strong> 加上一些小的 patch，以及来自 CVS 的「外部对象」、文档等</p>

    <p>   一个做了重大改动的分支，尤其是 GUI 方面</p>
