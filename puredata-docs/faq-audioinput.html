    <h1>如何获取音频输入？</h1>
    <p>播放音频完全正常，但似乎没有声音进入 Pd。</p>
    <p>也许你没有启用声音输入。</p>
    <p>在 OS X 上，确认在 "Audio Settings" 里选中声卡旁边的复选框已经勾选。</p>
    <p>另外，输入和输出通道数不一致的声卡在 Pd 里可能会出问题。试着把输入和输出的通道数设为相同。</p>
    <p>在所有平台上，检查操作系统自带的音频控制面板，确认其中启用了正确的输入，并且录音音量已经调高。</p>
